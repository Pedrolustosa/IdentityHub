<div class="ih-app-shell">
  <app-birthday-celebration />

  <!-- Desktop sidebar -->
  <div class="hidden lg:block">
    <app-sidebar [collapsed]="isSidebarCollapsed"></app-sidebar>
  </div>

  <!-- Mobile drawer -->
  @if (isMobileSidebarOpen) {
    <div
      class="fixed inset-0 z-40 bg-ink/40 backdrop-blur-[1px] lg:hidden"
      (click)="closeMobileSidebar()"
      aria-hidden="true"
    ></div>
    <div class="fixed inset-y-0 left-0 z-50 shadow-lift lg:hidden" (click)="closeMobileSidebar()">
      <app-sidebar [collapsed]="false"></app-sidebar>
    </div>
  }

  <div class="flex min-w-0 flex-1 flex-col">
    <app-top-navbar (sidebarToggle)="toggleSidebar()"></app-top-navbar>

    <div class="ih-chrome px-6 py-3">
      <app-breadcrumbs />
    </div>

    <main class="flex-1 p-6 md:p-8 lg:px-10">
      <router-outlet></router-outlet>
    </main>
  </div>
</div>

@if (items().length > 0) {
  <nav aria-label="Breadcrumb">
    <ol class="flex flex-wrap items-center gap-1.5 text-xs text-soft">
      @for (item of items(); track item.label; let last = $last) {
        <li class="flex items-center gap-1.5">
          @if (item.url && !last) {
            <a
              [routerLink]="item.url"
              class="transition-colors duration-150 hover:text-ink"
            >
              {{ item.label }}
            </a>
          } @else {
            <span class="font-medium text-ink-secondary" aria-current="page">{{ item.label }}</span>
          }
          @if (!last) {
            <span class="text-line-strong" aria-hidden="true">/</span>
          }
        </li>
      }
    </ol>
  </nav>
}
